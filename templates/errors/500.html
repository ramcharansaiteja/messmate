{% extends "base.html" %}

{% block title %}500 - Server Error - MessMate{% endblock %}

{% block content %}
<div style="min-height: 60vh; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem;">
    <div class="card-panel" style="max-width: 520px; width: 100%; text-align: center; padding: 3rem 2rem;">
        
        <!-- Large Error Badge -->
        <div style="font-size: 5rem; font-weight: 900; line-height: 1; color: #ef4444; margin-bottom: 0.5rem; letter-spacing: -2px;">
            500
        </div>

        <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(239, 68, 68, 0.15); color: #ef4444; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1.5rem;">
            <i class="fas fa-exclamation-triangle" style="font-size: 1.5rem;"></i>
        </div>

        <h1 style="font-size: 1.75rem; font-weight: 700; color: #ffffff; margin-bottom: 0.75rem;">
            Something Went Wrong
        </h1>

        <p style="color: #94a3b8; font-size: 0.95rem; line-height: 1.6; margin-bottom: 2rem;">
            An unexpected error occurred on our end while preparing your meal page. Please refresh or try again in a moment.
        </p>

        <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <a href="{{ url_for('home') }}" class="btn btn-outline">
                <i class="fas fa-home"></i> Back to Home
            </a>
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
                <i class="fas fa-redo"></i> Go to Dashboard
            </a>
        </div>

    </div>
</div>
{% endblock %}
